# 로컬 미리보기: docker compose up -d → http://localhost:4000
# Windows 에 Ruby 없이 Jekyll 을 띄운다 (Smart App Control 이 네이티브 gem 빌드를 막기 때문)
services:
  jekyll:
    image: ruby:3.3                    # jekyll 4.3.x 는 Ruby 3.4 에서 csv gem 문제로 실패할 수 있다
    container_name: thom-log-jekyll
    working_dir: /srv/jekyll
    # Windows 바인드 마운트는 파일 변경 이벤트가 전달되지 않아서 --force_polling 이 필요하다
    command: sh -c "bundle install && bundle exec jekyll serve --host 0.0.0.0 --force_polling"
    ports:
      - "127.0.0.1:4000:4000"          # 이 PC 에서만 접속 가능
    volumes:
      - .:/srv/jekyll
      - bundle:/usr/local/bundle       # 설치한 gem 캐시. 두 번째 실행부터 빨라진다

volumes:
  bundle:
    name: thom-log-bundle
