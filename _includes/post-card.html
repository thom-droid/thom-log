<li class="post-card">
  <h3 class="post-card__title"><a href="{{ include.post.url | relative_url }}">{{ include.post.title | escape }}</a></h3>
  <div class="post-card__tags" aria-label="Tags">
    {% for tag in include.post.tags %}
      <a class="post-card__tag" href="{{ '/search/' | relative_url }}?tag={{ tag | url_encode }}">{{ tag | escape }}</a>
    {% endfor %}
  </div>
</li>
