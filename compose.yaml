services:
  site:
    image: ruby:3.3
    working_dir: /srv/jekyll
    command: >-
      sh -c "gem install bundler -v 2.3.26 --no-document &&
      gem install rake --no-document &&
      bundle install &&
      bundle exec jekyll serve --drafts --host 0.0.0.0 --port 4000 --force_polling"
    environment:
      BUNDLE_PATH: /usr/local/bundle
      JEKYLL_ENV: development
    volumes:
      - .:/srv/jekyll
      - bundle_cache:/usr/local/bundle
    ports:
      - "127.0.0.1:4000:4000"
    init: true

volumes:
  bundle_cache:
