title: "Thom's Dev Log"
email: hsbang.thom@gmail.com
description: "Notes about software engineering, projects, and lessons learned along the way."
url: "https://thom-droid.github.io"
baseurl: "/thom-log"
github_username: thom-droid
lang: en
timezone: Asia/Seoul

theme: minima
plugins:
  - jekyll-feed

# Clean, stable URLs such as /thom-log/2026/08/hello-world/
permalink: /:year/:month/:title/

header_pages:
  - index.markdown
  - database/index.md
  - backend/index.md
  - project/index.md
  - learning/index.md
  - archive.md
  - search.md
  - about.markdown

show_excerpts: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: Thom

exclude:
  - compose.yaml
  - README.md
  - vendor/
